name: Check Actions Pinned

on:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  check-actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require full commit SHAs for remote actions
        run: bash .github/scripts/check-actions-pinned.sh
