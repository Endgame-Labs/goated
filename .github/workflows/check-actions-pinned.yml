name: Check Actions Pinned

on:
  pull_request:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  check-actions-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require full commit SHAs for remote actions
        run: bash .github/scripts/check-actions-pinned.sh
